
name: Xevo Build APK

run-name: Xevo Build #${{ inputs.jobId }}

on:
  workflow_dispatch:
    inputs:
      jobId:
        description: "ID pekerjaan dari bot"
        required: true
        type: string
      userId:
        description: "ID pengguna Telegram"
        required: true
        type: string
      payload:
        description: "Data project dalam JSON"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Download project ZIP
        env:
          PAYLOAD: ${{ inputs.payload }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          URL="$(jq -r '.zipAssetUrl // empty' <<< "$PAYLOAD")"

          if [[ -z "$URL" ]]; then
            echo "::error::payload.zipAssetUrl tidak ditemukan."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/project"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "$URL" \
            -o "$RUNNER_TEMP/project.zip"

          unzip -t "$RUNNER_TEMP/project.zip"
          unzip -q "$RUNNER_TEMP/project.zip" \
            -d "$RUNNER_TEMP/project"

      - name: Locate project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$RUNNER_TEMP/project"

          # Temukan root Flutter atau Android Gradle.
          FOUND=""

          while IFS= read -r FILE; do
            DIR="$(dirname "$FILE")"

            if [[ -f "$DIR/pubspec.yaml" ]]; then
              FOUND="$DIR"
              break
            fi

            if [[ -f "$DIR/gradlew" ]]; then
              FOUND="$DIR"
              break
            fi
          done < <(
            find "$ROOT" -type f \
              \( -name pubspec.yaml -o -name gradlew \)
          )

          if [[ -z "$FOUND" ]]; then
            echo "::error::Root project Flutter/Gradle tidak ditemukan."
            exit 1
          fi

          echo "path=$FOUND" >> "$GITHUB_OUTPUT"
          echo "Project ditemukan: $FOUND"

      - name: Setup Flutter
        if: hashFiles('**/pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build APK
        working-directory: ${{ steps.project.outputs.path }}
        env:
          PAYLOAD: ${{ inputs.payload }}
        shell: bash
        run: |
          set -euo pipefail

          VARIANT="$(jq -r \
            '.buildType // .buildVariant // "release"' \
            <<< "$PAYLOAD")"

          case "$VARIANT" in
            release|Release) MODE="release" ;;
            debug|Debug) MODE="debug" ;;
            *)
              echo "::error::Tipe build tidak dikenal: $VARIANT"
              exit 1
              ;;
          esac

          if [[ -f pubspec.yaml ]]; then
            flutter pub get
            flutter build apk "--$MODE"
          elif [[ -f gradlew ]]; then
            chmod +x gradlew

            if [[ "$MODE" == "release" ]]; then
              ./gradlew --no-daemon assembleRelease
            else
              ./gradlew --no-daemon assembleDebug
            fi
          else
            echo "::error::Project bukan Flutter atau Android Gradle."
            exit 1
          fi

      - name: Collect APK
        id: apk
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/apk"
          find . -type f -path '*/build/outputs/apk/*.apk' \
            -exec cp {} "$RUNNER_TEMP/apk/" \;

          if ! find "$RUNNER_TEMP/apk" -maxdepth 1 \
            -type f -name '*.apk' | grep -q .; then
            echo "::error::APK tidak ditemukan."
            exit 1
          fi

          ls -lh "$RUNNER_TEMP/apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ runner.temp }}/apk/*.apk
          if-no-files-found: error
          retention-days: 1
